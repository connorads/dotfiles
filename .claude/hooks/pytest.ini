# pytest strictness for this script dir (it has no pyproject.toml). The suite
# runs as `uv run --with pytest python -m pytest` from `mise run py-checks`, so
# no plugin gates here - only what plain pytest can turn from silent into fatal.
[pytest]
minversion = 9.0
addopts = -ra
strict_markers = true
strict_config = true
strict_xfail = true
empty_parameter_set_mark = fail_at_collect
filterwarnings =
    error

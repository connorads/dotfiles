<!doctype html>
<html>
  <head><title>Three things about static</title></head>
  <body>
    <p>Static is <strong>globally fast</strong>. When you deploy, every asset can sit
    on a CDN close to the reader.</p>
    <p>Static is <strong>consistently fast</strong>. There is no cold start to lose a
    tail latency budget to.</p>
    <p>Static is <strong>always online</strong>. Servers go down; a file on a CDN does
    not have that failure mode.</p>
  </body>
</html>

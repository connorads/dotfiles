<title>@@TITLE@@</title>
<meta charset="utf-8">
<script>addEventListener("error",e => { const h = document.documentElement; h.dataset.errors = ((h.dataset.errors || "")+" "+e.message).trim(); });</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Gaegu:wght@400;700&family=Young+Serif&display=swap">
<style>
/* Minicharts: desk, sheets of paper, serif names, one red pen. One look by choice. */
:root{--desk:#e3dac8;--paper:#fbf6ec;--ink:#2f261e;--soft:#6f6150;--red:#b23a38;--shade:#cdbfa8;
  --serif:"Young Serif",Georgia,serif;--hand:Gaegu,"DM Sans",sans-serif;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.page{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
#top h1{font:400 clamp(36px,10.5vw,68px)/1 var(--serif);letter-spacing:-.01em;margin:0}
#top h2{font:400 clamp(19px,2.2vw,25px)/1.2 var(--serif);margin:8px 0 0}
#top p{font:400 19px/1.3 var(--hand);font-size-adjust:.5;color:var(--red);margin:10px 0 0}
section{display:flex;flex-direction:column;gap:14px}
.parthead{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.parthead h2{font:400 clamp(22px,2.6vw,30px)/1.15 var(--serif);margin:0;text-wrap:balance}
.parthead p{font:400 17px/1.25 var(--hand);font-size-adjust:.5;color:var(--red);margin:0;min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1040px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--ink);border-radius:3px;display:flex;flex-direction:column;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 520px}
.cap2{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;padding:10px 13px;border-bottom:1px solid var(--ink)}
.cap2 h3{font:400 20px/1.15 var(--serif);margin:0}
.cap2 p{font:400 15.5px/1.2 var(--hand);font-size-adjust:.5;color:var(--soft);margin:0;min-width:0}
.cap2:has(.kind){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline}.cap2:has(.kind) p{grid-column:1/-1;grid-row:2}.cap2:has(.kind) h3{grid-row:1}
.kind{justify-self:end;grid-row:1;font:400 14px/1 var(--hand);font-size-adjust:.5;color:var(--red);border:1px solid currentColor;border-radius:20px;padding:4px 9px 3px;white-space:nowrap}
.card svg{display:block;width:100%;height:auto;aspect-ratio:520/420}
.card[data-m=plain] svg[data-m=art],.card[data-m=art] svg[data-m=plain]{display:none}
.foot{display:flex;flex-direction:column;flex:1;border-top:1px dashed var(--shade)}.foot .note{border-top:0}.foot .mode{align-self:flex-end;margin:0 12px 11px}
.mode{display:inline-flex;border:1px solid var(--ink);border-radius:20px;overflow:hidden;flex:none;font:400 13.5px/1 var(--hand);font-size-adjust:.5}
.mode button{font:inherit;color:var(--ink);background:none;border:0;padding:6px 10px 5px;cursor:pointer}.mode button+button{border-left:1px solid var(--ink)}
.mode button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
body:has(.mode.all){padding-bottom:80px}.mode.all{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);background:var(--paper);box-shadow:0 2px 0 var(--ink),0 6px 18px rgba(40,30,20,.18);font-size:16px}.mode.all button{padding:9px 18px 8px}
.note{font:400 16.5px/1.25 var(--hand);font-size-adjust:.5;color:var(--red);margin:0;padding:9px 13px 11px;box-sizing:border-box;height:calc(5em + 20px);overflow:hidden;flex:none;border-top:1px dashed var(--shade)}
footer{font-size:13.5px;line-height:1.55;color:var(--soft);border-top:1px solid var(--shade);padding-top:12px;max-width:62ch}
footer a{color:inherit}
text{user-select:none}
text.it,text.cap{font-family:var(--hand);font-size-adjust:.43}
text.it{letter-spacing:.3px}text.cap{letter-spacing:1px}
text.ser{font-family:var(--serif)}
.p{cursor:pointer;outline:none;transition:opacity .18s,transform .22s cubic-bezier(.3,.8,.3,1)}
.live .p:not(.on){opacity:.36}
.p.on{transform:translate(var(--dx,0),var(--dy,0))}
.p:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.bead{pointer-events:none}
.halo{pointer-events:none;animation:in .25s ease both}
@keyframes in{from{opacity:0}}
.mv{transform-box:fill-box;transform-origin:50% 50%}
.steam{animation:steam 3.2s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.25;transform:translateY(3px)}50%{opacity:1;transform:translateY(-3px)}}
.buzz{animation:buzz 1.6s ease-in-out infinite}
@keyframes buzz{0%,100%{transform:translate(0,0)}25%{transform:translate(1.6px,-1.8px)}50%{transform:translate(-1px,1.4px)}75%{transform:translate(1.8px,1px)}}
.fall{animation:fall 1.5s linear infinite}
@keyframes fall{from{transform:translateY(-7px);opacity:0}25%{opacity:1}75%{opacity:1}to{transform:translateY(9px);opacity:0}}
.flick{animation:flick 1.9s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.9,1.12)}70%{transform:scale(1.07,.92)}}
.sway{animation:sway 4.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.drift{animation:drift 5s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
.turn{animation:turn 40s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.off .mv{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.mv{animation:none}.p,.halo{transition:none;animation:none}}
#defs{position:absolute;width:0;height:0;overflow:hidden}
@media (max-width:480px){.note{height:calc(6.25em + 20px)}}
.grid:has(> .card:only-child){grid-template-columns:minmax(0,1fr);max-width:860px}
.grid:has(> .card:nth-child(2):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.grid:has(> .card:nth-child(2):last-child){grid-template-columns:minmax(0,1fr)}}
</style>
<svg id="defs" aria-hidden="true"></svg>
<div class="page" data-mode="main">
  <header id="top">
    <h1>@@TITLE@@</h1>
    @@SUB@@
  </header>
  <section data-s="chart"><div class="grid"></div></section>
  <footer>@@FOOT@@ <span id="total" hidden></span>Drawn with <a href="https://april-zhu.com/minicharts">Minicharts</a> by April Zhu.</footer>
</div>

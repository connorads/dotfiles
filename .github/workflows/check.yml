name: check

# PR-only. Two jobs: `check` runs `hk check --all` - the same gate as the local
# pre-commit hook, full-tree - and `bats` runs a focused slice of the shell test
# suite on Linux, which is the only place a macOS-developed suite's portability
# bugs can surface. Nothing runs on push; the owner commits through the
# pre-commit hook, so CI exists for contributor PRs (and manual dispatch).
# Cross-host nix eval is covered by the nix-eval hk step
# (.hk-hooks/nix-eval.sh owns the target list).
#
# Known, accepted limitations in CI:
# - ts-typecheck-* / py-typecheck-* / skill-check hit their graceful-skip
#   paths (node_modules, pyrefly, and ~/skills resolve via $HOME/the checkout
#   and are absent here).
# - gitleaks scans the staged diff, so it is a no-op under check --all.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: install nixfmt (from the flake's locked nixpkgs)
        run: nix profile install ./.config/nix#formatter.x86_64-linux
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          # Selective install mirroring the tools hk.pkl steps invoke - NOT a
          # bare `mise install`, which would pull the whole global toolset
          # (claude/codex/runtimes). pyrefly is skipped; its hk step
          # gracefully no-ops when absent.
          install_args: >-
            hk pkl shfmt shellcheck rumdl gitleaks oxlint ruff typos
            actionlint zizmor
        env:
          # oxlint is npm-backed; the aube package manager from the global
          # config is not installed here, so use plain npm (node is on the
          # runner image). The version is still pinned by mise.lock.
          MISE_NPM_PACKAGE_MANAGER: npm
      - name: install shell deps
        run: sudo apt-get update && sudo apt-get install -y zsh ripgrep
      - name: hk check --all
        run: hk check --all

  # The bats suite is macOS-developed, so a Linux run is the only guard against
  # a portability bug landing unseen - and this file set is exactly where those
  # bugs live (interpreter pinning, PATH assumptions, GNU-vs-BSD tool flags).
  #
  # Deliberately a focused set, not `mise run zsh-tests`: the full suite has
  # pre-existing failures on Linux that have nothing to do with what is gated
  # here, and a permanently red job gates nothing. Excluded, each with one
  # unrelated platform-specific failure:
  #   papercut.bats        - "repeated adds in the same second get unique ids"
  #   rl.bats              - "autoload resolves sibling helpers from fpath"
  #   agent-teleport.bats  - "copy mode ships a rewritten fork" (needs a clipboard)
  # Add a file here once it is green on Linux.
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install_args: bats
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.config/mise/config.toml
      - name: install shell deps
        # lsof is load-bearing: the Codex session lookup needs it, and the tests
        # that assert the "absent from PATH" fallback are only meaningful when a
        # real lsof exists to be excluded.
        run: sudo apt-get update && sudo apt-get install -y zsh tmux jq lsof ripgrep
      - name: stage the work-tree at $HOME
        # The dotfiles work-tree IS $HOME, and the tests resolve real paths
        # through it ($HOME/.hk-hooks/..., $HOME/.config/tmux/scripts/...).
        # Copying is simpler than overriding $HOME, which would move mise's own
        # data dir out from under the shims installed above.
        run: |
          shopt -s dotglob
          cp -a "$GITHUB_WORKSPACE"/. "$HOME"/
      - name: bats (files covering the bash-5 interpreter contract)
        run: |
          cd "$HOME"
          export PATH="$HOME/.local/bin:$PATH"
          bats --print-output-on-failure \
            .config/zsh/tests/bash5-preamble.bats \
            .config/zsh/tests/tmux-resurrect-post-save.bats \
            .config/zsh/tests/tmux-resurrect-sessions.bats \
            .config/zsh/tests/agent-session-lib.bats \
            .config/zsh/tests/claude-account-lib.bats \
            .config/zsh/tests/claude-plan-popup.bats \
            .config/zsh/tests/claude-branch-menu.bats \
            .config/zsh/tests/claude-session-adopt.bats \
            .config/zsh/tests/cleanup.bats

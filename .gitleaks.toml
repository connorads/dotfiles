# gitleaks config for the dotfiles repo (work-tree ~). Extends the default
# ruleset; entries here are allowlisted false-positive classes only.

[extend]
useDefault = true

[[allowlists]]
description = "PostHog project API keys (phc_...) are public client-side write-only keys, not secrets; vendored skills ship them hardcoded (e.g. media-use telemetry.mjs)"
regexTarget = "secret"
regexes = ['''^phc_[A-Za-z0-9]{30,}$''']

[[allowlists]]
description = "The 0123456789abcdef... counting placeholder upstream docs use as an example id (vendored alchemy docs: accountId in cli/profile)"
regexTarget = "secret"
regexes = ['''^(0123456789abcdef){2,}$''']

[[allowlists]]
description = "T3 Code keybinding shortcuts (\"key\": \"mod+shift+enter\") trip generic-api-key"
condition = "AND"
paths = ['''^\.t3/userdata/keybindings\.json$''']
regexTarget = "secret"
regexes = ['''^(mod|meta|cmd|ctrl|alt|shift)(\+[a-z0-9]+)+$''']

[[allowlists]]
description = "Modern Web Guidance WebCrypto algorithm names are public identifiers"
condition = "AND"
paths = ['''^\.config/skills/vendor/\.agents/skills/modern-web-guidance/guides/security/client-side-encryption\.md$''']
regexTarget = "secret"
regexes = ['''^MLKEM768-X25519$''']

[[allowlists]]
description = "HyperFrames CLI OAuth client_id is a public OAuth client identifier, not a secret (vendored hyperframes/media-use heygen.mjs and heygen.test.mjs)"
condition = "AND"
paths = ['''^\.config/skills/vendor/hyperframes/\.agents/skills/media-use/audio/scripts/lib/heygen(\.test)?\.mjs$''']
regexTarget = "secret"
regexes = ['''^Zg3LF4FCLoeJoGs2YqMtZ17g$''']

# Vale config for the house prose rules (AGENTS.md "Communication"), at the
# root dotfile alongside .typos.toml / .rumdl.toml.
#
# StylesPath resolves relative to this file, so `vale --config ~/.vale.ini`
# finds the style from any cwd. That is what makes one config serve both the hk
# gate and the `prose` command, with no second copy to drift.
#
# Because the work-tree root is $HOME, Vale's search-up finds this config from
# any directory under ~ that lacks its own - the house rules apply globally.
# A repo with its own .vale.ini is unaffected.
#
# No `Packages` key on purpose. Off-the-shelf styles (Google, Microsoft,
# write-good, proselint) are unvetted downloaded zips - the same provenance
# problem as skill vendoring - and Google's enforces US English against the
# British-English rule.
StylesPath = .config/vale/styles
MinAlertLevel = error

[*.{md,markdown,mdx}]
BasedOnStyles = Connorads

# Code comments. The extension list is Vale's, not a preference: only these
# formats get comment extraction, and everything else falls back to linting the
# whole file as prose, so a string literal would be gated as though it were
# English. .mjs/.cjs/.mts/.cts are absent because Vale has no lexer for them and
# `[formats] mjs = js` fails open - it parses, then reports zero findings on a
# file that reports two when named .js. Shell is out for the same reason and
# cannot be brought in, which leaves the tree's largest comment corpus ungated.
#
# `BasedOnStyles = Connorads` and no more: naming the built-in `Vale` style too
# would add its error-level Spelling rule, which does not know a dictionary word
# from an identifier - `lockfile` in a comment is a finding.
#
# Vale extracts Python `#` comments but NOT docstrings, so prose in a docstring
# is out of reach here as well as in the markdown section.
[*.{py,ts,tsx,js,jsx,rs,go,rb,lua}]
BasedOnStyles = Connorads

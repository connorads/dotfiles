# deny.toml — cargo-deny template
# Copy to project root as `deny.toml`
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# --- Security advisories (RustSec DB) ---
[advisories]
severity = "low"  # flag everything, not just critical

# --- Licence compliance ---
[licenses]
unlicensed = "deny"
confidence-threshold = 0.8
copyleft = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# For deps with missing/ambiguous licence metadata:
# [[licenses.clarify]]
# crate = "some-crate"
# expression = "MIT"
# license-files = [{ path = "LICENSE", hash = 0xDEADBEEF }]

# --- Crate bans ---
[bans]
multiple-versions = "warn"  # flag duplicate versions in the dep tree

# Ban specific crates (uncomment/extend as needed):
# deny = [
#     { crate = "openssl", use-instead = "rustls" },
# ]

# Layer boundary via `wrappers`: ban a crate everywhere EXCEPT the listed
# wrappers. Works on workspace path crates, not only registry ones (verified on
# cargo-deny 0.20.2), so one entry per internal crate gates the layer diagram.
# Layered example: engine and render are pure, frame composes them, shell and
# web are the leaves, and device crates stay in the shell.
# deny = [
#     { crate = "my-engine",   wrappers = ["my-frame", "my-web", "my-shell"], reason = "only the composition and leaf crates consume the engine" },
#     { crate = "my-render",   wrappers = ["my-frame", "my-web", "my-shell"], reason = "render depends only on data" },
#     { crate = "my-frame",    wrappers = ["my-web", "my-shell"],             reason = "frame is shared by the native shell and the browser" },
#     { crate = "my-emulator", wrappers = ["my-frame", "my-shell"],           reason = "emulator code never enters engine or render" },
#     { crate = "sdl2",        wrappers = ["my-shell"],                       reason = "device code lives only in the shell" },
# ]

# --- Source restrictions ---
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# allow-git = ["https://github.com/org/repo"]

# TypeScript syntax gates that oxlint cannot express. Run:
# ast-grep scan -r typescript-ast-grep.yml src
# Every rule has a TSX twin because either parser silently skips the other extension.
# See typescript-security.md, Sinks and parity gaps. A renamed sink escapes.
---
{id: no-ambient-clock-in-core, language: typescript, severity: error, message: "Inject the clock; zero-argument Date reads ambient time.", files: ["**/src/domain/**"], rule: { pattern: new Date() }}
---
{id: no-ambient-clock-in-core-tsx, language: tsx, severity: error, message: "Inject the clock; zero-argument Date reads ambient time.", files: ["**/src/domain/**"], rule: { pattern: new Date() }}
---
{id: json-parse-outside-boundary, language: typescript, severity: error, message: "Decode JSON into a domain type inside src/boundary.", files: ["**/src/**"], ignores: ["**/src/boundary/**"], rule: { any: [{ pattern: JSON.parse($$$) }, { pattern: 'JSON["parse"]($$$)' }] }}
---
{id: json-parse-outside-boundary-tsx, language: tsx, severity: error, message: "Decode JSON into a domain type inside src/boundary.", files: ["**/src/**"], ignores: ["**/src/boundary/**"], rule: { any: [{ pattern: JSON.parse($$$) }, { pattern: 'JSON["parse"]($$$)' }] }}
---
{id: no-prototype-access, language: typescript, severity: error, message: "Do not access __proto__ or constructor.prototype.", files: ["**/src/**"], rule: { any: [{ pattern: $O.__proto__ }, { pattern: '$O["__proto__"]' }, { pattern: "$O['__proto__']" }, { pattern: "$O[`__proto__`]" }, { pattern: $O.constructor.prototype }] }}
---
{id: no-prototype-access-tsx, language: tsx, severity: error, message: "Do not access __proto__ or constructor.prototype.", files: ["**/src/**"], rule: { any: [{ pattern: $O.__proto__ }, { pattern: '$O["__proto__"]' }, { pattern: "$O['__proto__']" }, { pattern: "$O[`__proto__`]" }, { pattern: $O.constructor.prototype }] }}
---
{id: no-strip-unsafe-syntax, language: typescript, severity: error, message: "Node type stripping rejects decorators and accessor fields.", files: ["**/src/**"], rule: { any: [{ kind: decorator }, { kind: public_field_definition, regex: '^accessor[[:space:]]' }] }}
---
{id: no-strip-unsafe-syntax-tsx, language: tsx, severity: error, message: "Node type stripping rejects decorators and accessor fields.", files: ["**/src/**"], rule: { any: [{ kind: decorator }, { kind: public_field_definition, regex: '^accessor[[:space:]]' }] }}
---
{id: shell-sink-non-literal, language: typescript, severity: error, message: "Use execFile or spawn with a literal command and argv.", files: ["**/src/**"], rule: { kind: call_expression, all: [{ has: { field: function, regex: '(^|\\.)(exec|execSync|spawn|spawnSync)$' } }, { has: { field: arguments, has: { nthChild: 1, not: { kind: string } } } }] }}
---
{id: shell-sink-non-literal-tsx, language: tsx, severity: error, message: "Use execFile or spawn with a literal command and argv.", files: ["**/src/**"], rule: { kind: call_expression, all: [{ has: { field: function, regex: '(^|\\.)(exec|execSync|spawn|spawnSync)$' } }, { has: { field: arguments, has: { nthChild: 1, not: { kind: string } } } }] }}
---
{id: unvalidated-archive-extract, language: typescript, severity: error, message: "Reject traversal members before extracting an archive.", files: ["**/src/**"], rule: { any: [{ pattern: tar.x($$$) }, { pattern: $Z.extractAllTo($$$) }] }}
---
{id: unvalidated-archive-extract-tsx, language: tsx, severity: error, message: "Reject traversal members before extracting an archive.", files: ["**/src/**"], rule: { any: [{ pattern: tar.x($$$) }, { pattern: $Z.extractAllTo($$$) }] }}
---
{id: unsafe-deserialise, language: typescript, severity: error, message: "Do not deserialize untrusted bytes or unsafe YAML.", files: ["**/src/**"], rule: { any: [{ pattern: yaml.load($$$) }, { pattern: $Y.unsafeLoad($$$) }, { pattern: v8.deserialize($$$) }, { pattern: deserialize($$$) }] }}
---
{id: unsafe-deserialise-tsx, language: tsx, severity: error, message: "Do not deserialize untrusted bytes or unsafe YAML.", files: ["**/src/**"], rule: { any: [{ pattern: yaml.load($$$) }, { pattern: $Y.unsafeLoad($$$) }, { pattern: v8.deserialize($$$) }, { pattern: deserialize($$$) }] }}
---
{id: string-built-sql-at-sink, language: typescript, severity: error, message: "Use bound parameters or a recognised driver SQL tag.", files: ["**/src/**"], rule: { kind: call_expression, all: [{ has: { field: function, regex: '(^|\\.)(query|execute|raw|unsafe)$' } }, { has: { field: arguments, has: { nthChild: 1, any: [{ kind: template_string, has: { kind: template_substitution } }, { pattern: $A + $B }] } } }] }}
---
{id: string-built-sql-at-sink-tsx, language: tsx, severity: error, message: "Use bound parameters or a recognised driver SQL tag.", files: ["**/src/**"], rule: { kind: call_expression, all: [{ has: { field: function, regex: '(^|\\.)(query|execute|raw|unsafe)$' } }, { has: { field: arguments, has: { nthChild: 1, any: [{ kind: template_string, has: { kind: template_substitution } }, { pattern: $A + $B }] } } }] }}
---
{id: tls-verification-off, language: typescript, severity: error, message: "Pin a CA instead of disabling TLS verification.", files: ["**/src/**"], rule: { kind: pair, all: [{ has: { field: key, regex: '^rejectUnauthorized$' } }, { has: { field: value, kind: "false" } }] }}
---
{id: tls-verification-off-tsx, language: tsx, severity: error, message: "Pin a CA instead of disabling TLS verification.", files: ["**/src/**"], rule: { kind: pair, all: [{ has: { field: key, regex: '^rejectUnauthorized$' } }, { has: { field: value, kind: "false" } }] }}
---
{id: weak-hash-algorithm, language: typescript, severity: error, message: "Use sha256 or a keyed HMAC instead of md5 or sha1.", files: ["**/src/**"], rule: { kind: call_expression, all: [{ has: { field: function, regex: '(^|\\.)createHash$' } }, { has: { field: arguments, has: { kind: string, regex: '^[''"](md5|sha1)' } } }] }}
---
{id: weak-hash-algorithm-tsx, language: tsx, severity: error, message: "Use sha256 or a keyed HMAC instead of md5 or sha1.", files: ["**/src/**"], rule: { kind: call_expression, all: [{ has: { field: function, regex: '(^|\\.)createHash$' } }, { has: { field: arguments, has: { kind: string, regex: '^[''"](md5|sha1)' } } }] }}
---
{id: weak-rsa-key, language: typescript, severity: error, message: "RSA modulusLength must be at least 2048 bits.", files: ["**/src/**"], rule: { any: [{ pattern: '$C.generateKeyPairSync($ALG, { modulusLength: 512 })' }, { pattern: '$C.generateKeyPairSync($ALG, { modulusLength: 768 })' }, { pattern: '$C.generateKeyPairSync($ALG, { modulusLength: 1024 })' }, { pattern: '$C.generateKeyPairSync($ALG, { modulusLength: 1536 })' }] }}
---
{id: weak-rsa-key-tsx, language: tsx, severity: error, message: "RSA modulusLength must be at least 2048 bits.", files: ["**/src/**"], rule: { any: [{ pattern: '$C.generateKeyPairSync($ALG, { modulusLength: 512 })' }, { pattern: '$C.generateKeyPairSync($ALG, { modulusLength: 768 })' }, { pattern: '$C.generateKeyPairSync($ALG, { modulusLength: 1024 })' }, { pattern: '$C.generateKeyPairSync($ALG, { modulusLength: 1536 })' }] }}
---
{id: fetch-without-signal, language: typescript, severity: error, message: "Give fetch a direct signal property and deadline.", files: ["**/src/**"], rule: { kind: call_expression, all: [{ has: { field: function, kind: identifier, regex: '^fetch$' } }, { not: { has: { field: arguments, has: { kind: object, has: { kind: pair, stopBy: neighbor, has: { field: key, regex: '^signal$' } } } } } }, { not: { has: { field: arguments, has: { kind: object, has: { kind: shorthand_property_identifier, stopBy: neighbor, regex: '^signal$' } } } } }] }}
---
{id: fetch-without-signal-tsx, language: tsx, severity: error, message: "Give fetch a direct signal property and deadline.", files: ["**/src/**"], rule: { kind: call_expression, all: [{ has: { field: function, kind: identifier, regex: '^fetch$' } }, { not: { has: { field: arguments, has: { kind: object, has: { kind: pair, stopBy: neighbor, has: { field: key, regex: '^signal$' } } } } } }, { not: { has: { field: arguments, has: { kind: object, has: { kind: shorthand_property_identifier, stopBy: neighbor, regex: '^signal$' } } } } }] }}
